services:
  - type: cron
    name: web3-builder-scanner
    runtime: python
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TWITTER_COOKIES_PATH
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "deepseek/deepseek-chat:free"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SCORE_THRESHOLD
        value: "60"
      - key: MAX_ACCOUNTS_PER_RUN
        value: "50"
